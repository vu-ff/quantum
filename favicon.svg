<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Quantum Mechanics I">
  <rect width="32" height="32" rx="7" fill="#5a6414"/>
  <!-- The Bloch sphere with a state on it: QM-I's mark (Lecture 1), drawn in
       the light olive of the notes' definition fill (bgdef) on the course's
       olive accent.  QM-II's mark is the two levels in a well. -->
  <g stroke="#f5f6ea" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="16" cy="16" r="10.5" stroke-width="2"/>
    <ellipse cx="16" cy="16" rx="10.5" ry="3.6" stroke-width="1.4"/>
    <path d="M16 16 L22.4 8.6" stroke-width="2.2"/>
  </g>
  <circle cx="22.4" cy="8.6" r="2.1" fill="#f5f6ea"/>
</svg>
