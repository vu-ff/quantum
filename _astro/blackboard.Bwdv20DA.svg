<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 500" width="1800" height="500" fill="#000" stroke="#000" stroke-linecap="round" stroke-linejoin="round" font-family="Charter, 'Bitstream Charter', 'Sitka Text', Cambria, Georgia, 'DejaVu Serif', serif">
<!-- The page-top blackboard. Used as a CSS mask (black = ink), so its colour comes from the theme. Formulas are from Quantum Mechanics I, in the conventions it adopts from QM-II (notes/notation-bible.md): the inner product is antilinear in the FIRST slot; U_t = e^{-itH/hbar}; hbar explicit; frequency nu, never omega; projections are E, never P (momentum); the identity is the double-struck one. The qubit's formulas are Lecture 1's, checked in scripts/check-l1-algebra.py; the box and oscillator energies, [Q,P] and the uncertainty bound are the standard results Part II will prove (syllabus.md S4). The drawing is the course's mark: the Bloch sphere with a state precessing about an axis. -->
<g stroke="none">
<text x="40" y="70" font-size="36" font-style="italic" transform="rotate(-2 40 70)">|ψ⟩⟨ψ| = (𝟙 + <tspan font-style="normal" font-weight="bold">r</tspan> · <tspan font-style="normal" font-weight="bold">σ</tspan>)/2</text>
<text x="52" y="124" font-size="24" font-style="italic" transform="rotate(-1 52 124)">ψ(θ, φ) = cos(θ/2)|0⟩ + e<tspan baseline-shift="super" font-size="0.62em">iφ</tspan> sin(θ/2)|1⟩</text>
<text x="40" y="184" font-size="28" font-style="italic" transform="rotate(1 40 184)">|⟨χ, ψ⟩|<tspan baseline-shift="super" font-size="0.62em">2</tspan> = (1 + <tspan font-style="normal" font-weight="bold">r</tspan><tspan baseline-shift="sub" font-size="0.7em">χ</tspan> · <tspan font-style="normal" font-weight="bold">r</tspan><tspan baseline-shift="sub" font-size="0.7em">ψ</tspan>)/2</text>
<text x="40" y="246" font-size="28" font-style="italic" transform="rotate(-1 40 246)">Prob(±1) = (1 ± <tspan font-style="normal" font-weight="bold">m</tspan> · <tspan font-style="normal" font-weight="bold">r</tspan>)/2</text>
<text x="52" y="300" font-size="24" font-style="italic" transform="rotate(1 52 300)">σ<tspan baseline-shift="sub" font-size="0.7em">a</tspan>σ<tspan baseline-shift="sub" font-size="0.7em">b</tspan> = δ<tspan baseline-shift="sub" font-size="0.7em">ab</tspan>𝟙 + i ε<tspan baseline-shift="sub" font-size="0.7em">abc</tspan>σ<tspan baseline-shift="sub" font-size="0.7em">c</tspan></text>
<text x="40" y="360" font-size="28" font-style="italic" transform="rotate(-1 40 360)">iħ dψ/dt = Hψ,    U<tspan baseline-shift="sub" font-size="0.7em">t</tspan> = e<tspan baseline-shift="super" font-size="0.62em">−itH/ħ</tspan></text>
<text x="52" y="416" font-size="22" font-style="italic" transform="rotate(1 52 416)">Prob(↓, t) = (Ω/Ω̃)<tspan baseline-shift="super" font-size="0.62em">2</tspan> sin<tspan baseline-shift="super" font-size="0.62em">2</tspan>(Ω̃t/2)</text>
<text x="1300" y="72" font-size="30" font-style="italic" transform="rotate(-1 1300 72)"><tspan font-style="normal" font-weight="bold">ṙ</tspan> = ν <tspan font-style="normal" font-weight="bold">n</tspan> × <tspan font-style="normal" font-weight="bold">r</tspan></text>
<text x="1312" y="126" font-size="22" font-style="italic" transform="rotate(1 1312 126)">H = c𝟙 + (ħν/2) <tspan font-style="normal" font-weight="bold">n</tspan> · <tspan font-style="normal" font-weight="bold">σ</tspan></text>
<text x="1300" y="184" font-size="26" font-style="italic" transform="rotate(-1 1300 184)">q̇ = ∂h/∂p,    ṗ = −∂h/∂q</text>
<text x="1310" y="240" font-size="22" font-style="italic" transform="rotate(1 1310 240)">q = φ,   p = (ħ/2) cos θ</text>
<text x="1300" y="304" font-size="28" font-style="italic" transform="rotate(-1 1300 304)">ρ = (𝟙 + <tspan font-style="normal" font-weight="bold">r</tspan> · <tspan font-style="normal" font-weight="bold">σ</tspan>)/2,  |<tspan font-style="normal" font-weight="bold">r</tspan>| ≤ 1</text>
<text x="1310" y="370" font-size="22" font-style="italic" transform="rotate(1 1310 370)">Prob(K) = Tr(KρK<tspan baseline-shift="super" font-size="0.62em">†</tspan>)</text>
<text x="1300" y="424" font-size="24" font-style="italic" transform="rotate(-1 1300 424)">ψ ⟼ E<tspan baseline-shift="sub" font-size="0.7em">a</tspan>ψ / ‖E<tspan baseline-shift="sub" font-size="0.7em">a</tspan>ψ‖</text>
<text x="938" y="60" font-size="24" font-style="italic">z</text>
<text x="1060" y="90" font-size="26" font-style="normal" font-weight="bold">r</text>
<text x="944" y="32" font-size="24" font-weight="bold" font-style="normal">n</text>
</g>
<g fill="none">
<!-- the Bloch sphere: outline, equator (front solid, back dashed), the z axis as the field axis n, a state r and the circle it precesses on -->
<circle cx="930" cy="260" r="170" stroke-width="2.6"/>
<path d="M760 260 A 170 52 0 0 0 1100 260" stroke-width="2"/>
<path d="M760 260 A 170 52 0 0 1 1100 260" stroke-width="1.6" stroke-dasharray="8 7"/>
<path d="M930 430 L930 50" stroke-width="1.8"/>
<path d="M924 62 L930 48 L936 62" stroke-width="1.8"/>
<path d="M930 260 L1048 142" stroke-width="3"/>
<circle cx="1048" cy="142" r="6" stroke-width="2.4"/>
<path d="M812 142 A 118 34 0 0 0 1048 142" stroke-width="2"/>
<path d="M812 142 A 118 34 0 0 1 1048 142" stroke-width="1.6" stroke-dasharray="8 7"/>
<path d="M970 174 l14 -2 l-10 10" stroke-width="2"/>
</g>
</svg>
